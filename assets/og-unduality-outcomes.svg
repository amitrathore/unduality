<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Unduality: clarity without certainty, peace without denial, power without control</title>
  <desc id="desc">Three connected fields present the possibilities of clarity, peace, and power through an open inquiry into mind, self, and consciousness.</desc>

  <rect width="400" height="556" fill="#b6a8eb"/>
  <rect x="400" width="400" height="556" fill="#65cdb3"/>
  <rect x="800" width="400" height="556" fill="#f1ca4b"/>
  <path d="M400 0V556M800 0V556" stroke="#12130f" stroke-opacity=".28" stroke-width="2"/>

  <g fill="#12130f" font-family="Arial, sans-serif">
    <text x="42" y="61" font-size="28" font-weight="900" letter-spacing="-.5">UNDUALITY</text>
    <text x="1158" y="59" font-size="18" font-weight="700" text-anchor="end" letter-spacing="1">OBSERVE FOR YOURSELF</text>

    <g font-family="Arial Black, Arial, sans-serif" font-weight="900" letter-spacing="-3">
      <text x="42" y="235" font-size="61">CLARITY,</text>
      <text x="442" y="235" font-size="61">PEACE,</text>
      <text x="842" y="235" font-size="61">POWER,</text>
    </g>

    <g font-family="Georgia, serif" font-size="34" font-style="italic">
      <text x="42" y="285">without</text>
      <text x="442" y="285">without</text>
      <text x="842" y="285">without</text>
    </g>

    <g font-family="Arial Black, Arial, sans-serif" font-size="47" font-weight="900" letter-spacing="-2.5">
      <text x="42" y="350">CERTAINTY.</text>
      <text x="442" y="350">DENIAL.</text>
      <text x="842" y="350">CONTROL.</text>
    </g>

    <g font-size="19" font-weight="700">
      <text x="42" y="493">CLEARER PERCEPTION</text>
      <text x="442" y="493">LESS ADDED CONFLICT</text>
      <text x="842" y="493">CAPACITY TO RESPOND</text>
    </g>
  </g>

  <rect y="556" width="1200" height="74" fill="#12130f"/>
  <text x="42" y="602" fill="#fbfaf5" font-family="Arial, sans-serif" font-size="21" font-weight="700" letter-spacing=".7">AN OPEN INQUIRY INTO MIND, SELF &amp; CONSCIOUSNESS</text>
  <text x="1158" y="602" fill="#fbfaf5" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="end">UNDUALITY.COM</text>
</svg>
